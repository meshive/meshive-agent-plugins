name: Plugin compatibility

on: pull_request

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check marketplace and MCP manifests
        run: python3 -B -m unittest discover -s tests -v
